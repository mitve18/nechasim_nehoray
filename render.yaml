# Render Blueprint. ערכים עם sync: false מוזנים רק בדשבורד של Render ולא נשמרים בקוד.
services:
  - type: web
    name: agreements-drafter
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION  # אותה גרסה כמו ב-.github/workflows/sync.yml
        value: "3.13"
      - key: DRIVE_FOLDER_ID
        value: 1HS1MqHNvRyHeRuLZWWQQ8ClSBFgoRZQs
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REFRESH_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      # חובה: מפתח החתימה של עוגיית הכניסה. בלעדיו האתר מציג "לא מוגדר" ולא נפתח לאף אחד.
      # python -c "import secrets; print(secrets.token_urlsafe(48))". החלפה מנתקת את כל המחוברים
      - key: SECRET_KEY
        sync: false
      # ה-admin הראשון. נוצר בהפעלה רק כשעוד אין admin במסד, ומקבל את הטיוטות הקיימות. אחרי הכניסה הראשונה אפשר למחוק
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      # אופציונלי: דומיינים (מופרדים בפסיק) שהרשמה מהם נפתחת מיד. כל כתובת אחרת ממתינה לאישור ב-/admin/users
      - key: SIGNUP_DOMAINS
        sync: false
      # כפתור הסנכרון: fine-grained token רק ל-repo הזה, Actions: Read and write
      - key: GH_DISPATCH_TOKEN
        sync: false
      - key: GH_REPO
        sync: false
