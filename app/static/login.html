<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>כניסה · מנסח ההסכמים</title>
    <!-- אותו דף ל-/login ול-/register: הסקריפט בסוף מציג את הטופס המתאים לכתובת -->
    <meta name="theme-color" content="#ffffff" />
    <script>
      // מצב בהיר/כהה נקבע לפני שהדף מצויר, כדי שבמצב כהה לא יהבהב לבן. ברירת המחדל בהיר; הכפתור שומר את הבחירה
      try {
        document.documentElement.dataset.theme = localStorage.getItem("theme") || "light";
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <link rel="icon" type="image/png" href="/static/favicon.png" />
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Hebrew:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* אותה פלטה כמו באתר (index.html) */
      :root {
        --bg: #f4f7fb;
        --text: #1b2433;
        --muted: #5d6b7d;
        --line: #e1e7ef;
        --brand: #1a6dc8;
        --brand-dark: #1459a8;
        --brand-deep: #0b2a5c;
        --accent: #48a6f4;
        --ring: rgba(72, 166, 244, 0.25);
        --err-bg: #fdecee;
        --err: #9b1c2c;
        --card: #fff;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #17191e;
        --card: #21252d;
        --text: #e5e9ef;
        --muted: #9aa4b2;
        --line: #323844;
        --brand: #2f7fd9;
        --brand-dark: #4791e6;
        --brand-deep: #d6e5fa;
        --err-bg: #3d1f25;
        --err: #ff9fab;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        font-family: "Inter", "Noto Sans Hebrew", system-ui, "Segoe UI", Arial, sans-serif;
        color: var(--text);
        background:
          radial-gradient(900px 500px at 50% -10%, rgba(72, 166, 244, 0.14), transparent 70%),
          var(--bg);
      }
      form {
        width: min(380px, 100%);
        background: var(--card);
        border-radius: 16px;
        border: 1px solid var(--line);
        padding: 32px 28px 24px;
        box-shadow:
          0 1px 2px rgba(11, 42, 92, 0.05),
          0 20px 44px -18px rgba(11, 42, 92, 0.22);
      }
      .logo {
        display: block;
        width: 96px;
        height: auto;
        margin: 0 auto 16px;
        filter: drop-shadow(0 6px 8px rgba(11, 42, 92, 0.18));
      }
      h1 {
        margin: 0;
        text-align: center;
        font-size: 24px;
        font-weight: 800;
        color: var(--brand-deep);
      }
      .sub {
        margin: 4px 0 22px;
        text-align: center;
        font-size: 14px;
        color: var(--muted);
      }
      label {
        display: block;
        margin-bottom: 6px;
        font-size: 14px;
        font-weight: 500;
      }
      input {
        width: 100%;
        font: inherit;
        padding: 11px 13px;
        border: 1px solid var(--line);
        border-radius: 10px;
        margin-bottom: 16px;
        background: var(--card);
        color: inherit;
      }
      input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--ring);
      }
      button {
        width: 100%;
        font: inherit;
        font-weight: 700;
        padding: 11px;
        border: 0;
        border-radius: 10px;
        background: var(--brand);
        color: #fff;
        cursor: pointer;
      }
      button:hover {
        background: var(--brand-dark);
      }
      button:focus-visible {
        outline: 3px solid var(--ring);
        outline-offset: 2px;
      }
      .err {
        margin: 0 0 14px;
        padding: 8px 12px;
        border-radius: 8px;
        background: var(--err-bg);
        color: var(--err);
        font-size: 14px;
      }
      .note {
        margin: 16px 0 0;
        text-align: center;
        font-size: 12px;
        color: var(--muted);
      }
      .ok {
        margin: 0 0 14px;
        padding: 8px 12px;
        border-radius: 8px;
        background: #e5f4ea;
        color: #1d6b3d;
        font-size: 14px;
      }
      :root[data-theme="dark"] .ok {
        background: #1f3a2a;
        color: #9fe0b5;
      }
      .hint {
        margin: -10px 0 16px;
        font-size: 12px;
        color: var(--muted);
      }
      .switch {
        margin: 16px 0 0;
        text-align: center;
        font-size: 14px;
      }
      .switch a {
        color: var(--brand);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <form method="post" action="/login" id="login" hidden>
      <img class="logo" src="/static/logo.webp" alt="" width="96" height="78" />
      <h1>מנסח ההסכמים</h1>
      <p class="sub">כלי פנימי לניסוח טיוטות הסכמים</p>
      <p class="ok" id="login-ok" role="status" hidden>
        נרשמת בהצלחה. החשבון ממתין לאישור מנהל, ואחרי האישור אפשר להיכנס.
      </p>
      <p class="err" id="login-err" role="alert" hidden></p>
      <label for="email">אימייל</label>
      <input id="email" name="email" type="email" dir="ltr" autocomplete="username" required />
      <label for="pw">סיסמה</label>
      <input id="pw" name="password" type="password" autocomplete="current-password" required />
      <input type="hidden" name="next" id="next" value="/" />
      <button>כניסה</button>
      <p class="switch">אין לך משתמש? <a href="/register">הרשמה</a></p>
      <p class="note">אחרי הכניסה האתר זוכר אותך ל-30 יום. שכחת סיסמה? פנה למנהל המערכת</p>
    </form>
    <form method="post" action="/register" id="register" hidden>
      <img class="logo" src="/static/logo.webp" alt="" width="96" height="78" />
      <h1>הרשמה</h1>
      <p class="sub">משתמש אישי: הטיוטות והשיחות שלך גלויות רק לך</p>
      <p class="err" id="reg-err" role="alert" hidden></p>
      <label for="r-name">שם מלא</label>
      <input id="r-name" name="name" maxlength="100" autocomplete="name" required />
      <label for="r-email">אימייל</label>
      <input id="r-email" name="email" type="email" dir="ltr" autocomplete="email" required />
      <label for="r-pw">סיסמה</label>
      <input id="r-pw" name="password" type="password" minlength="10" autocomplete="new-password" required />
      <p class="hint">10 תווים לפחות</p>
      <button>הרשמה</button>
      <p class="switch">כבר יש לך משתמש? <a href="/login">כניסה</a></p>
    </form>
    <script>
      const q = new URLSearchParams(location.search);
      const $ = (id) => document.getElementById(id);
      const page = location.pathname === "/register" ? "register" : "login";
      // השרת מחזיר רק קוד שגיאה, והטקסט כאן: כך אי אפשר לשתול הודעה מזויפת בקישור
      const ERRORS = {
        login: {
          1: "האימייל או הסיסמה שגויים. נסה שוב.",
          locked: "יותר מדי ניסיונות שגויים. אפשר לנסות שוב בעוד 15 דקות.",
          pending: "החשבון ממתין לאישור מנהל, או שהושבת. פנה למנהל המערכת.",
        },
        register: {
          email: "כתובת האימייל לא תקינה.",
          name: "חסר שם.",
          password: "הסיסמה צריכה להיות באורך 10 תווים לפחות (ולא ארוכה מדי).",
          exists: "הכתובת הזו כבר רשומה. אפשר להיכנס, ומי ששכח סיסמה פונה למנהל.",
          locked: "יותר מדי הרשמות מהרשת הזו. אפשר לנסות שוב בעוד 15 דקות.",
        },
      };
      $(page).hidden = false;
      document.title = (page === "register" ? "הרשמה" : "כניסה") + " · מנסח ההסכמים";
      const err = $(page === "register" ? "reg-err" : "login-err");
      const msg = ERRORS[page][q.get("error")];
      err.hidden = !msg;
      err.textContent = msg || "";
      $("login-ok").hidden = !q.has("registered");
      $(page === "register" ? "r-name" : "email").focus();
      $("next").value = q.get("next") || "/"; // השרת מוודא שזו כתובת בתוך האתר
    </script>
  </body>
</html>
