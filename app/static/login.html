<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>כניסה · מנסח ההסכמים</title>
    <!-- אותו דף ל-/login ול-/register: הסקריפט בסוף מציג את הטופס המתאים לכתובת -->
    <meta name="theme-color" content="#ffffff" />
    <script>
      // מצב בהיר/כהה נקבע לפני שהדף מצויר, כדי שבמצב כהה לא יהבהב לבן. ברירת המחדל בהיר; הכפתור שומר את הבחירה
      try {
        document.documentElement.dataset.theme = localStorage.getItem("theme") || "light";
      } catch {
        document.documentElement.dataset.theme = "light";
      }
    </script>
    <link rel="icon" type="image/png" href="/static/favicon.png" />
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Hebrew:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      /* אותה פלטה כמו באתר (index.html) */
      :root {
        --bg: #f4f7fb;
        --text: #1b2433;
        --muted: #5d6b7d;
        --line: #e1e7ef;
        --brand: #1a6dc8;
        --brand-dark: #1459a8;
        --brand-deep: #0b2a5c;
        --accent: #48a6f4;
        --ring: rgba(72, 166, 244, 0.25);
        --err-bg: #fdecee;
        --err: #9b1c2c;
        --card: #fff;
        --toast: #0b2a5c;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --bg: #17191e;
        --card: #21252d;
        --text: #e5e9ef;
        --muted: #9aa4b2;
        --line: #323844;
        --brand: #2f7fd9;
        --brand-dark: #4791e6;
        --brand-deep: #d6e5fa;
        --err-bg: #3d1f25;
        --err: #ff9fab;
        --toast: #343b47;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        font-family: "Inter", "Noto Sans Hebrew", system-ui, "Segoe UI", Arial, sans-serif;
        color: var(--text);
        background:
          radial-gradient(900px 500px at 50% -10%, rgba(72, 166, 244, 0.14), transparent 70%),
          var(--bg);
      }
      form {
        width: min(380px, 100%);
        background: var(--card);
        border-radius: 16px;
        border: 1px solid var(--line);
        padding: 32px 28px 24px;
        box-shadow:
          0 1px 2px rgba(11, 42, 92, 0.05),
          0 20px 44px -18px rgba(11, 42, 92, 0.22);
      }
      .logo {
        display: block;
        width: 96px;
        height: auto;
        margin: 0 auto 16px;
        filter: drop-shadow(0 6px 8px rgba(11, 42, 92, 0.18));
      }
      h1 {
        margin: 0;
        text-align: center;
        font-size: 24px;
        font-weight: 800;
        color: var(--brand-deep);
      }
      .sub {
        margin: 4px 0 22px;
        text-align: center;
        font-size: 14px;
        color: var(--muted);
      }
      label {
        display: block;
        margin-bottom: 6px;
        font-size: 14px;
        font-weight: 500;
      }
      input {
        width: 100%;
        font: inherit;
        padding: 11px 13px;
        border: 1px solid var(--line);
        border-radius: 10px;
        margin-bottom: 16px;
        background: var(--card);
        color: inherit;
      }
      input:focus {
        outline: none;
        border-color: var(--accent);
        box-shadow: 0 0 0 3px var(--ring);
      }
      button {
        width: 100%;
        font: inherit;
        font-weight: 700;
        padding: 11px;
        border: 0;
        border-radius: 10px;
        background: var(--brand);
        color: #fff;
        cursor: pointer;
      }
      button:hover {
        background: var(--brand-dark);
      }
      button:focus-visible {
        outline: 3px solid var(--ring);
        outline-offset: 2px;
      }
      .err {
        margin: 0 0 14px;
        padding: 8px 12px;
        border-radius: 8px;
        background: var(--err-bg);
        color: var(--err);
        font-size: 14px;
      }
      .note {
        margin: 16px 0 0;
        text-align: center;
        font-size: 12px;
        color: var(--muted);
      }
      /* שדה סיסמה עם כפתור עין: הכפתור יושב בתוך השדה בצד שמאל, כי הסיסמה נכתבת משמאל לימין */
      .pw {
        position: relative;
        margin-bottom: 16px;
      }
      .pw input {
        margin-bottom: 0;
        padding-left: 46px;
      }
      .eye {
        position: absolute;
        top: 50%;
        left: 6px;
        transform: translateY(-50%);
        width: 36px;
        height: 36px;
        padding: 0;
        display: grid;
        place-items: center;
        border-radius: 8px;
        background: none;
        color: var(--muted);
      }
      .eye:hover {
        background: var(--line);
        color: var(--text);
      }
      .eye svg {
        width: 18px;
        height: 18px;
      }
      .eye .shut,
      .eye[aria-pressed="true"] .open {
        display: none;
      }
      .eye[aria-pressed="true"] .shut {
        display: block;
      }
      /* הודעה קטנה בתחתית המסך שנעלמת לבד, כמו "הסנכרון הושלם" באתר */
      #toast {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        align-items: flex-start;
        gap: 12px;
        max-width: min(520px, calc(100vw - 32px));
        padding: 10px 18px;
        border-radius: 10px;
        background: var(--toast);
        color: #fff;
        font-size: 14px;
        box-shadow: 0 12px 30px -12px rgba(11, 42, 92, 0.45);
        transition: opacity 0.6s ease;
      }
      #toast.fade {
        opacity: 0;
      }
      #toast[hidden] {
        display: none;
      }
      @media (prefers-reduced-motion: reduce) {
        #toast {
          transition: none;
        }
      }
      #toast button {
        width: auto;
        flex: none;
        padding: 0 4px;
        background: none;
        color: inherit;
        font-weight: 400;
        opacity: 0.8;
      }
      #toast button:hover {
        background: none;
        opacity: 1;
      }
      .hint {
        margin: -10px 0 16px;
        font-size: 12px;
        color: var(--muted);
      }
      .switch {
        margin: 16px 0 0;
        text-align: center;
        font-size: 14px;
      }
      .switch a {
        color: var(--brand);
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <form method="post" action="/login" id="login" hidden>
      <img class="logo" src="/static/logo.webp" alt="" width="96" height="78" />
      <h1>מנסח ההסכמים</h1>
      <p class="sub">כלי פנימי לניסוח טיוטות הסכמים</p>
      <p class="err" id="login-err" role="alert" hidden></p>
      <label for="email">אימייל</label>
      <input id="email" name="email" type="email" dir="ltr" autocomplete="username" required />
      <label for="pw">סיסמה</label>
      <div class="pw">
        <input id="pw" name="password" type="password" dir="ltr" autocomplete="current-password" required />
      </div>
      <input type="hidden" name="next" id="next" value="/" />
      <button>כניסה</button>
      <p class="switch">אין לך משתמש? <a href="/register">הרשמה</a></p>
      <p class="note">אחרי הכניסה האתר זוכר אותך ל-30 יום. שכחת סיסמה? פנה למנהל המערכת</p>
    </form>
    <form method="post" action="/register" id="register" hidden>
      <img class="logo" src="/static/logo.webp" alt="" width="96" height="78" />
      <h1>הרשמה</h1>
      <p class="sub">משתמש אישי: הטיוטות והשיחות שלך גלויות רק לך</p>
      <p class="err" id="reg-err" role="alert" hidden></p>
      <label for="r-name">שם מלא</label>
      <input id="r-name" name="name" maxlength="100" autocomplete="name" required />
      <label for="r-email">אימייל</label>
      <input id="r-email" name="email" type="email" dir="ltr" autocomplete="email" required />
      <label for="r-pw">סיסמה</label>
      <div class="pw">
        <input id="r-pw" name="password" type="password" dir="ltr" minlength="10" autocomplete="new-password"
               aria-describedby="r-pw-hint" required />
      </div>
      <p class="hint" id="r-pw-hint">10 תווים לפחות</p>
      <button>הרשמה</button>
      <p class="switch">כבר יש לך משתמש? <a href="/login">כניסה</a></p>
    </form>
    <div id="toast" role="status" aria-live="polite" hidden>
      <span id="toast-text"></span>
      <button type="button" id="toast-close" aria-label="סגירת ההודעה">✕</button>
    </div>
    <script>
      const q = new URLSearchParams(location.search);
      const $ = (id) => document.getElementById(id);
      const page = location.pathname === "/register" ? "register" : "login";
      // השרת מחזיר רק קוד שגיאה, והטקסט כאן: כך אי אפשר לשתול הודעה מזויפת בקישור
      const ERRORS = {
        login: {
          1: "האימייל או הסיסמה שגויים. נסה שוב.",
          locked: "יותר מדי ניסיונות שגויים. אפשר לנסות שוב בעוד 15 דקות.",
          pending: "החשבון ממתין לאישור מנהל, או שהושבת. פנה למנהל המערכת.",
        },
        register: {
          email: "כתובת האימייל לא תקינה.",
          name: "חסר שם.",
          password: "הסיסמה צריכה להיות באורך 10 תווים לפחות (ולא ארוכה מדי).",
          exists: "הכתובת הזו כבר רשומה. אפשר להיכנס, ומי ששכח סיסמה פונה למנהל.",
          locked: "יותר מדי הרשמות מהרשת הזו. אפשר לנסות שוב בעוד 15 דקות.",
        },
      };
      $(page).hidden = false;
      document.title = (page === "register" ? "הרשמה" : "כניסה") + " · מנסח ההסכמים";
      const err = $(page === "register" ? "reg-err" : "login-err");
      const msg = ERRORS[page][q.get("error")];
      err.hidden = !msg;
      err.textContent = msg || "";
      $(page === "register" ? "r-name" : "email").focus();
      $("next").value = q.get("next") || "/"; // השרת מוודא שזו כתובת בתוך האתר

      // כפתור עין בכל שדה סיסמה: מציג את הסיסמה כל עוד הוא לחוץ, ומסתיר שוב בשליחת הטופס
      const EYE =
        '<svg class="open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>' +
        '<svg class="shut" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.6 5.1A10 10 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.2M6.6 6.6A17 17 0 0 0 2 12s3.5 7 10 7a9.8 9.8 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/><path d="m2 2 20 20"/></svg>';
      for (const input of document.querySelectorAll(".pw input")) {
        const eye = document.createElement("button");
        eye.type = "button";
        eye.className = "eye";
        eye.innerHTML = EYE;
        const set = (show) => {
          input.type = show ? "text" : "password";
          eye.setAttribute("aria-pressed", show);
          eye.ariaLabel = eye.title = show ? "הסתרת הסיסמה" : "הצגת הסיסמה";
        };
        set(false);
        eye.onclick = () => {
          set(input.type === "password");
          input.focus();
        };
        input.form.addEventListener("submit", () => set(false)); // הדפדפן לא שומר סיסמה גלויה בהיסטוריה
        input.after(eye);
      }

      // אחרי הרשמה שממתינה לאישור: הודעה קטנה למטה שנעלמת אחרי כמה שניות
      function toast(text, ms = 7000) {
        $("toast-text").textContent = text;
        $("toast").hidden = false;
        $("toast").classList.remove("fade");
        clearTimeout(toast.timer);
        toast.timer = setTimeout(hideToast, ms);
      }
      function hideToast() {
        clearTimeout(toast.timer);
        $("toast").classList.add("fade");
        toast.timer = setTimeout(() => ($("toast").hidden = true), 600);
      }
      $("toast-close").onclick = hideToast;
      if (q.has("registered")) {
        toast("בקשת ההרשמה נשלחה למנהל המערכת וממתינה לאישור. אחרי האישור אפשר להיכנס.", 14000); // הודעה ארוכה
        history.replaceState(null, "", "/login"); // רענון הדף לא יציג את ההודעה שוב
      }
    </script>
  </body>
</html>
