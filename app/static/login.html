<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>כניסה · מנסח ההסכמים</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root { --navy: #16233f; --navy-2: #22345c; --gold: #b0894f; --line: #e3ded3; --muted: #667085; }
  * { box-sizing: border-box; }
  body { font-family: "Heebo", system-ui, "Segoe UI", Arial, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px;
         background: radial-gradient(circle at 80% 0%, var(--navy-2), var(--navy) 60%); color: #1b2333; }
  form { background: #fff; padding: 36px 32px 28px; border-radius: 16px; box-shadow: 0 20px 50px rgba(0,0,0,.25); width: min(380px, 100%); border-top: 5px solid var(--gold); }
  .logo { width: 52px; height: 52px; border-radius: 12px; background: var(--navy); display: grid; place-items: center; margin: 0 auto 14px; }
  h1 { font-size: 24px; font-weight: 800; margin: 0; text-align: center; color: var(--navy); }
  .sub { text-align: center; color: var(--muted); font-size: 14px; margin: 4px 0 24px; }
  label { display: block; font-weight: 500; font-size: 14px; margin-bottom: 6px; }
  input, button { width: 100%; font: inherit; padding: 11px 13px; border-radius: 10px; }
  input { border: 1px solid var(--line); margin-bottom: 16px; }
  input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px rgba(176,137,79,.2); }
  button { background: var(--navy); color: #fff; border: 0; cursor: pointer; font-weight: 700; }
  button:hover { background: var(--navy-2); }
  button:focus-visible { outline: 3px solid rgba(176,137,79,.6); outline-offset: 2px; }
  .err { background: #fdecee; color: #9b1c2c; border-radius: 8px; padding: 8px 12px; margin: 0 0 14px; font-size: 14px; }
  .note { color: var(--muted); font-size: 12px; text-align: center; margin: 18px 0 0; }
</style>
</head>
<body>
<form method="post" action="/login">
  <div class="logo" aria-hidden="true">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#b0894f" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v18M5 21h14M7 7h10M4 14l3-7 3 7a3 3 0 0 1-6 0zM14 14l3-7 3 7a3 3 0 0 1-6 0z"/></svg>
  </div>
  <h1>מנסח ההסכמים</h1>
  <p class="sub">כלי פנימי לניסוח טיוטות הסכמים</p>
  <p class="err" id="err" role="alert" hidden>סיסמה שגויה</p>
  <label for="pw">סיסמה</label>
  <input id="pw" name="password" type="password" autocomplete="current-password" required autofocus>
  <button>כניסה</button>
  <p class="note">לשימוש עובדי המשרד בלבד</p>
</form>
<script>if (location.search.includes("error")) document.getElementById("err").hidden = false;</script>
</body>
</html>
