# סנכרון יומי של מאגר ההסכמים מ-Drive ל-Neon. הרצה ידנית: Actions ← sync ← Run workflow
name: sync
on:
  schedule:
    - cron: "0 3 * * *"  # 03:00 UTC = 06:00 בשעון קיץ, 05:00 בשעון חורף בישראל. GitHub עלול לאחר בכמה דקות
  workflow_dispatch:
concurrency: sync

jobs:
  sync:
    runs-on: ubuntu-24.04  # גרסה קבועה: ubuntu-latest עובר ל-Ubuntu 26, ושם tesseract-ocr-heb עוד לא נבדק
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - run: |
          sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-heb
          # tessdata_best: מודלים מדויקים יותר (ואיטיים יותר) מאלה של Ubuntu. דורסים את הקבצים שהחבילות התקינו
          dir=$(dirname "$(dpkg -L tesseract-ocr-heb | grep 'heb.traineddata$')")
          for l in heb eng; do
            sudo curl -fsSL -o "$dir/$l.traineddata" "https://github.com/tesseract-ocr/tessdata_best/raw/4.1.0/$l.traineddata"
          done
      - run: pip install -r requirements.txt
      - run: python sync.py
        env:
          DRIVE_FOLDER_ID: 1HS1MqHNvRyHeRuLZWWQQ8ClSBFgoRZQs
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
