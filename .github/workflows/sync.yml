# סנכרון יומי של מאגר ההסכמים מ-Drive ל-Neon. הרצה ידנית: Actions ← sync ← Run workflow
name: sync
on:
  schedule:
    - cron: "0 3 * * *"  # 03:00 UTC = 06:00 בשעון קיץ, 05:00 בשעון חורף בישראל. GitHub עלול לאחר בכמה דקות
  workflow_dispatch:
concurrency: sync

jobs:
  sync:
    runs-on: ubuntu-24.04  # גרסה קבועה: ubuntu-latest עובר ל-Ubuntu 26, ושם tesseract-ocr-heb עוד לא נבדק
    timeout-minutes: 60
    steps:
      # מקובעים ל-commit ולא לתגית: תגית אפשר להזיז לקוד אחר. Dependabot מעדכן אותם (.github/dependabot.yml)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.13"
          cache: pip
      - run: |
          sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-heb
          # tessdata_best: מודלים מדויקים יותר (ואיטיים יותר) מאלה של Ubuntu. דורסים את הקבצים שהחבילות התקינו
          dir=$(dirname "$(dpkg -L tesseract-ocr-heb | grep 'heb.traineddata$')")
          for l in heb eng; do
            sudo curl -fsSL -o "$dir/$l.traineddata" "https://github.com/tesseract-ocr/tessdata_best/raw/4.1.0/$l.traineddata"
          done
          # ה-checksum של הקבצים מ-4.1.0. קובץ שהשתנה עוצר את הסנכרון במקום לרוץ עם מודל לא ידוע
          (cd "$dir" && sha256sum -c - <<'SUMS'
          dbaa827aea6bc21215638447f17783a1004987c2d0bf5573d111fee397abdae5  heb.traineddata
          8280aed0782fe27257a68ea10fe7ef324ca0f8d85bd2fd145d1c2b560bcb66ba  eng.traineddata
          SUMS
          )
      - run: pip install -r requirements.txt
      - run: python sync.py
        env:
          DRIVE_FOLDER_ID: 1HS1MqHNvRyHeRuLZWWQQ8ClSBFgoRZQs
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
